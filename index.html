<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Be My Valentine?</title>

<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    background-color: #ffe6f0;
    margin: 0;
    text-align: center;
  }
  h1 {
    color: #c2185b;
    margin-bottom: 30px;
  }
  .buttons {
    margin-bottom: 20px;
  }
  button {
    padding: 12px 25px;
    font-size: 20px;
    margin: 10px;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    transition: all 0.3s ease;
  }

  #yesBtn {
    background-color: #ff4081;
    color: white;
  }

  #noBtn {
    background-color: #555;
    color: white;
  }

  .image-container {
    height: 260px; /* fixed space so layout doesn't jump */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  img {
    max-width: 250px;
    display: none;
  }
</style>
</head>

<body>

<h1 id="question">Will You Be My Valentine? 💖</h1>

<div class="buttons">
  <button id="yesBtn">Yes ❤️</button>
  <button id="noBtn">No 😏</button>
</div>

<div class="image-container">
  <img id="sadImg" src="sad.png">
  <img id="catImg" src="cat.png">
</div>

<script>

let yesSize = 20;

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const sadImg = document.getElementById("sadImg");
const catImg = document.getElementById("catImg");
const question = document.getElementById("question");

noBtn.addEventListener("click", function() {
  sadImg.style.display = "block";
  catImg.style.display = "none";

  yesSize += 10;
  yesBtn.style.fontSize = yesSize + "px";
  yesBtn.style.padding = (yesSize/2) + "px";
});

yesBtn.addEventListener("click", function() {
  catImg.style.display = "block";
  sadImg.style.display = "none";

  question.innerText = "Yaaay! I knew you would say YES! 💖😘";
});

</script>

</body>
</html>
