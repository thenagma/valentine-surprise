<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Be My Valentine?</title>

<style>
  body {
    text-align: center;
    font-family: Arial, sans-serif;
    background-color: #ffe6f0;
    margin-top: 80px;
  }

  h1 {
    color: #c2185b;
  }

  button {
    padding: 10px 20px;
    font-size: 18px;
    margin: 10px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    transition: all 0.3s ease;
  }

  #yesBtn {
    background-color: #ff4081;
    color: white;
  }

  #noBtn {
    background-color: #555;
    color: white;
  }

  img {
    margin-top: 20px;
  }
</style>
</head>

<body>

<h1 id="question">Will You Be My Valentine? 💖</h1>

<button id="yesBtn">Yes ❤️</button>
<button id="noBtn">No 😏</button>

<br><br>

<!-- Images -->
<img id="sadImg" src="sad.png" style="width:220px; display:none;">
<img id="catImg" src="cat.png" style="width:250px; display:none;">

<script>

let yesSize = 18;

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const sadImg = document.getElementById("sadImg");
const catImg = document.getElementById("catImg");
const question = document.getElementById("question");

noBtn.addEventListener("click", function() {

  // Show sad image, hide cat
  sadImg.style.display = "block";
  catImg.style.display = "none";

  // Grow YES button
  yesSize += 10;
  yesBtn.style.fontSize = yesSize + "px";
  yesBtn.style.padding = (yesSize/2) + "px";

});

yesBtn.addEventListener("click", function() {

  // Show cat image, hide sad
  catImg.style.display = "block";
  sadImg.style.display = "none";

  question.innerText = "Yaaay! I knew you would say YES! 💖😘";

});

</script>

</body>
</html>
