<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Be My Valentine?</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffe6f0;
    font-family: Arial, sans-serif;
  }

  .container {
    text-align: center;
  }

  h1 {
    color: #c2185b;
    margin-bottom: 20px;
  }

  .buttons {
    margin: 20px 0;
  }

  button {
    padding: 12px 25px;
    font-size: 20px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  #yesBtn {
    background-color: #ff4081;
    color: white;
  }

  #noBtn {
    background-color: #444;
    color: white;
  }

  .image-box {
    width: 100%;
    height: 260px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  img {
    max-width: 250px;
    display: none;
  }

</style>
</head>

<body>

<div class="container">

  <h1 id="question">Will You Be My Valentine? 💖</h1>

  <div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 😏</button>
  </div>

  <div class="image-box">
    <img id="sadImg" src="sad.png">
    <img id="catImg" src="cat.png">
  </div>

</div>
 <script>

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const sadImg = document.getElementById("sadImg");
const catImg = document.getElementById("catImg");
const question = document.getElementById("question");

let increase = 0;
let alreadyAccepted = false; // 🔥 Track if Yes clicked

noBtn.addEventListener("click", function() {

  // If already said YES
  if (alreadyAccepted) {
    question.innerText = "Oops 😌 Chance chala gaya... Ab option nahi hai! 💖";
    sadImg.style.display = "none";
    catImg.style.display = "block";
    noBtn.disabled = true; // disable No button
    return;
  }

  sadImg.style.display = "block";
  catImg.style.display = "none";

  increase += 10;

  yesBtn.style.fontSize = (20 + increase) + "px";
  yesBtn.style.padding = (12 + increase/2) + "px " + (25 + increase) + "px";
});

yesBtn.addEventListener("click", function() {

  alreadyAccepted = true; // 🔥 Mark as accepted

  catImg.style.display = "block";
  sadImg.style.display = "none";
  question.innerText = "Yaaay! I knew you would say YES! 💖😘";

  // Reset Yes button
  increase = 0;
  yesBtn.style.fontSize = "20px";
  yesBtn.style.padding = "12px 25px";
});

</script>

</body>
</html>
